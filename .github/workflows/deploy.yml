name: Deploy to firefly

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never let two deploys race on the host.
concurrency:
  group: firefly-deploy
  cancel-in-progress: false

env:
  APP_ROOT: /srv/camptool
  SOCKET: /run/camptool/camptool.sock

jobs:
  deploy:
    runs-on: [self-hosted, firefly]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Verify runtime secret is wired
        # The job shares the app container's env, so fail fast (before build +
        # restart) if the ops-managed env-file is missing the auth secret.
        # Length-checked only — never printed.
        run: |
          if [ -z "${BETTER_AUTH_SECRET:-}" ]; then
            echo "::error::BETTER_AUTH_SECRET is empty — check the ops env-file"
            exit 1
          fi
          echo "BETTER_AUTH_SECRET present (${#BETTER_AUTH_SECRET} chars)"

      - name: Build (Bun)
        # CAMP_THEME is a BUILD-TIME var: Vite bakes the active camp-theme package
        # into the bundle here (see vite.config.ts / app/theme). It must be set on
        # the BUILD step, NOT in the ops runtime env-file (which is injected only
        # when the app process launches — too late for the build). This firefly
        # deploy is Math Camp's, so build with its theme.
        env:
          CAMP_THEME: "@camptool/mathcamp-theme"
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build

      - name: Stage release tree
        run: |
          set -euo pipefail
          REL="$APP_ROOT/releases/$GITHUB_SHA"
          rm -rf "$REL"
          mkdir -p "$REL"
          # Ready-to-run tree: build output, server entry, the run wrapper, and
          # db/migrations (the app auto-migrates on boot from cwd). `packages/`
          # ships too so the release-dir `bun install` can resolve the workspace
          # (`workspace:*`) camp-theme deps in package.json.
          cp -r build db server.ts run package.json bun.lock packages "$REL"/
          # The build-step `bun install` created packages/*/node_modules; drop them
          # so the release-dir production install below regenerates cleanly.
          find "$REL/packages" -name node_modules -type d -prune -exec rm -rf {} + 2>/dev/null || true
          chmod +x "$REL/run"
          # Stamp the build SHA so the running app can report which release it is
          # (server.ts serves it at /_version; the health check below verifies it).
          printf '%s' "$GITHUB_SHA" > "$REL/BUILD_SHA"
          # Prune to production dependencies inside the release dir.
          ( cd "$REL" && bun install --frozen-lockfile --production )

      - name: Activate + restart
        run: |
          set -euo pipefail
          # Atomic flip, then poke the supervisor's restart sentinel.
          ln -sfn "releases/$GITHUB_SHA" "$APP_ROOT/current"
          touch "$APP_ROOT/restart"

      - name: Wait for the NEW build to be serving
        # Poll /_version until it reports THIS commit's SHA — proving the
        # supervisor actually restarted into the new release. A plain "GET / ->
        # 200" is not enough: the old process answers 200 too, so a flaky/missed
        # restart would pass silently (it did, repeatedly — see plans/camptool.md).
        # Use Bun (guaranteed in the image); no dependency on curl/seq.
        env:
          EXPECT_SHA: ${{ github.sha }}
        run: |
          bun -e '
            const sock = process.env.SOCKET;
            const want = (process.env.EXPECT_SHA ?? "").trim();
            for (let i = 1; i <= 90; i++) {
              try {
                const r = await fetch("http://localhost/_version", { unix: sock });
                const got = (await r.text()).trim();
                if (r.status === 200 && got === want) {
                  console.log(`healthy: /_version -> ${got}`);
                  process.exit(0);
                }
                console.log(`/_version -> ${r.status} "${got.slice(0, 12)}" (want ${want.slice(0, 12)}, retry ${i})`);
              } catch (e) {
                console.log(`socket not ready (retry ${i}): ${e?.code ?? e?.message ?? e}`);
              }
              await new Promise((res) => setTimeout(res, 1000));
            }
            console.error(`::error::new build ${want} never came up on ${sock} within 90s — the supervisor likely did not restart into the new release (the old build may still be serving). Re-run this workflow, and check the supervisor restart-sentinel.`);
            process.exit(1);
          '

      - name: Prune old releases (keep last 5)
        if: always()
        run: |
          cd "$APP_ROOT/releases" 2>/dev/null || exit 0
          n=0
          for d in $(ls -1dt -- */ 2>/dev/null); do
            n=$((n + 1))
            [ "$n" -gt 5 ] && rm -rf -- "$d"
          done
          true
