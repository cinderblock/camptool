name: Deploy to firefly

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never let two deploys race on the host.
concurrency:
  group: firefly-deploy
  cancel-in-progress: false

env:
  APP_ROOT: /srv/camptool
  SOCKET: /run/camptool/camptool.sock

jobs:
  # ---------------------------------------------------------------- build ---
  # On a GitHub-hosted runner, NOT firefly.
  #
  # This used to run on the self-hosted runner along with everything else,
  # because the whole deploy was mirrored from the gate-manager/steamboat
  # pattern ("the app's repo deploys itself") without separating what must run
  # on the box from what merely could. Building there is what must NOT: firefly
  # is 8 GB with no swap, shared with UniFi OS Server, Prometheus/Grafana,
  # Caddy, nginx-cache, headscale and five other runner containers — and the
  # live camptool app runs INSIDE the runner container. `camptool-runner` sets
  # no `mem_limit`, so a build that wants ~2 GB is competing with production for
  # host RAM with nothing to stop it.
  #
  # It stopped being hypothetical on 2026-08-25: three deploys in a row were
  # OOM-killed mid-build (exit 137), each at a different point, taking the live
  # site, the unrelated bins app and the runner itself down with them. A deploy
  # should never be able to do that. See plans/wizard-step-homes.md.
  #
  # The repo is public, so hosted runners are free and have 16 GB.
  build:
    runs-on: ubuntu-latest
    # Stated rather than inherited: the repo default is currently `read`, but
    # that's a setting anyone can change, and this job needs nothing beyond the
    # source it builds.
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version baked into the camptool-runner image, so the
          # lockfile and the production install on the host resolve identically.
          bun-version: 1.3.0

      - name: Build
        # CAMP_THEME (which camp-theme package Vite bakes into the bundle) is a
        # BUILD-TIME var, and it is deliberately NOT hardcoded — this workflow
        # names no camp, so a fork gets the built-in @camptool/default-theme.
        #
        # It used to be inherited from the app container's env, which only worked
        # while the build ran on the deployment host. It is now the `CAMP_THEME`
        # repo variable, and ops — which is master for the deployment — is what
        # sets it: declared in `servers/firefly/camptool-runner/build-vars.env`
        # and pushed here by ops's `sync-camptool-repo-vars` job. So ops still
        # owns the value; this repo just reads it.
        #
        # The deploy job below cross-checks it against the host's own CAMP_THEME,
        # so drift (or a variable that was never synced) fails loudly instead of
        # silently shipping the wrong camp's branding.
        env:
          CAMP_THEME: ${{ vars.CAMP_THEME }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build

      - name: Verify the migration chain
        # The app migrates on boot, so a broken chain is a production crash with
        # no rollback. Checked here, before the release is staged or the app is
        # restarted. Catches a missing SQL file and — the one that actually bit
        # us — a non-monotonic journal `when`, which drizzle skips in silence
        # (see plans/migration-timestamp-skip.md).
        run: bun run db:verify

      - name: Assemble the release tree
        env:
          CAMP_THEME: ${{ vars.CAMP_THEME }}
        run: |
          set -euo pipefail
          # Stamp the build SHA so the running app can report which release it is
          # (server.ts serves it at /_version; the health check below verifies it),
          # and the theme this bundle was actually built with, for the guard.
          printf '%s' "$GITHUB_SHA" > BUILD_SHA
          printf '%s' "${CAMP_THEME:-}" > BUILD_THEME
          # Ready-to-run tree: build output, server entry, the run wrapper, and
          # db/migrations (the app auto-migrates on boot from cwd). `packages/`
          # ships too so the release-dir `bun install` on the host can resolve the
          # workspace (`workspace:*`) camp-theme deps in package.json.
          #
          # Tar straight from the checkout rather than staging a copy first. The
          # old cp-then-delete dragged the whole packages/*/node_modules tree
          # along only to remove it, and `cp -r` chokes on the symlinks Bun puts
          # there — under `set -e` that is a failed deploy, not a warning.
          # `--exclude` also covers the root node_modules, which must NOT ship:
          # the host reinstalls production-only into the release dir.
          #
          # Tar rather than uploading the tree directly, because
          # actions/upload-artifact drops the executable bit that `run` needs
          # (mode 100755 in git) and resolves symlinks.
          tar -czf release.tar.gz \
            --exclude=node_modules \
            build db server.ts run package.json bun.lock packages \
            BUILD_SHA BUILD_THEME
          echo "--- release contents (top level)"
          tar -tzf release.tar.gz | awk -F/ '{print $1}' | sort -u
          # `run` must arrive executable or the supervisor can't start the app.
          tar -tvzf release.tar.gz | grep -E ' run$' || {
            echo "::error::run wrapper missing from the release tarball"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release.tar.gz
          retention-days: 7
          if-no-files-found: error

  # --------------------------------------------------------------- deploy ---
  # On firefly. Only the things that genuinely have to happen on the box:
  # unpack into the releases volume, install production deps, flip the symlink,
  # poke the supervisor, prove the new SHA is serving. Seconds of work, and no
  # step here can starve the app it is deploying.
  deploy:
    needs: build
    runs-on: [self-hosted, firefly]
    # `actions: read` is what download-artifact@v4 needs to fetch the build job's
    # upload. Covered by the repo's current `read` default, but spelled out so a
    # change to that default can't silently break deploys.
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      # No `actions/checkout` — this job builds nothing, and the workspace on a
      # self-hosted runner persists between runs. Clear the artifact from the
      # previous deploy so a failed download can't quietly unpack a stale
      # release over the top of this SHA's directory.
      - name: Clear the previous run's artifact
        run: rm -f release.tar.gz

      - name: Verify runtime secret is wired
        # The job shares the app container's env, so fail fast (before the
        # release is staged or activated) if the ops-managed env-file is missing
        # the auth secret. Length-checked only — never printed.
        run: |
          if [ -z "${BETTER_AUTH_SECRET:-}" ]; then
            echo "::error::BETTER_AUTH_SECRET is empty — check the ops env-file"
            exit 1
          fi
          echo "BETTER_AUTH_SECRET present (${#BETTER_AUTH_SECRET} chars)"

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}

      - name: Unpack the release
        run: |
          set -euo pipefail
          REL="$APP_ROOT/releases/$GITHUB_SHA"
          rm -rf "$REL"
          mkdir -p "$REL"
          tar -xzf release.tar.gz -C "$REL"
          chmod +x "$REL/run"

      - name: Check the bundle was built for THIS camp
        # The theme is baked in at build time on a machine that can't see the
        # host's env-file, so the two could drift — and the failure mode is
        # silent: a deploy that looks green and quietly serves another camp's
        # branding. Compare what the bundle was built with against what this
        # host expects, and refuse rather than activate.
        run: |
          set -euo pipefail
          BUILT="$(cat "$APP_ROOT/releases/$GITHUB_SHA/BUILD_THEME" 2>/dev/null || true)"
          WANT="${CAMP_THEME:-}"
          if [ "$BUILT" != "$WANT" ]; then
            echo "::error::theme mismatch — bundle built with '${BUILT:-<default>}' but this host expects '${WANT:-<default>}'. Set the CAMP_THEME repo variable to match the ops env-file, then re-run."
            exit 1
          fi
          echo "theme ok: ${BUILT:-<default>}"

      - name: Install production dependencies
        # Cheap (~6s, a few hundred MB) and deliberately left on the host: it
        # resolves against the same Bun the app runs under, and keeps the
        # artifact to the build output rather than a node_modules tree.
        run: |
          set -euo pipefail
          cd "$APP_ROOT/releases/$GITHUB_SHA"
          bun install --frozen-lockfile --production

      - name: Activate + restart
        run: |
          set -euo pipefail
          # Atomic flip, then poke the supervisor's restart sentinel.
          ln -sfn "releases/$GITHUB_SHA" "$APP_ROOT/current"
          touch "$APP_ROOT/restart"

      - name: Wait for the NEW build to be serving
        # Poll /_version until it reports THIS commit's SHA — proving the
        # supervisor actually restarted into the new release. A plain "GET / ->
        # 200" is not enough: the old process answers 200 too, so a flaky/missed
        # restart would pass silently (it did, repeatedly — see plans/camptool.md).
        # Use Bun (guaranteed in the image); no dependency on curl/seq.
        env:
          EXPECT_SHA: ${{ github.sha }}
        run: |
          bun -e '
            const sock = process.env.SOCKET;
            const want = (process.env.EXPECT_SHA ?? "").trim();
            for (let i = 1; i <= 90; i++) {
              try {
                const r = await fetch("http://localhost/_version", { unix: sock });
                const got = (await r.text()).trim();
                if (r.status === 200 && got === want) {
                  console.log(`healthy: /_version -> ${got}`);
                  process.exit(0);
                }
                console.log(`/_version -> ${r.status} "${got.slice(0, 12)}" (want ${want.slice(0, 12)}, retry ${i})`);
              } catch (e) {
                console.log(`socket not ready (retry ${i}): ${e?.code ?? e?.message ?? e}`);
              }
              await new Promise((res) => setTimeout(res, 1000));
            }
            console.error(`::error::new build ${want} never came up on ${sock} within 90s — the supervisor likely did not restart into the new release (the old build may still be serving). Re-run this workflow, and check the supervisor restart-sentinel.`);
            process.exit(1);
          '

      - name: Prune old releases (keep last 5)
        if: always()
        run: |
          cd "$APP_ROOT/releases" 2>/dev/null || exit 0
          n=0
          for d in $(ls -1dt -- */ 2>/dev/null); do
            n=$((n + 1))
            [ "$n" -gt 5 ] && rm -rf -- "$d"
          done
          true
